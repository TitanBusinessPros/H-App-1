<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#170923">
  <title>Terms of Service &amp; Privacy Policy | Halloween App</title>
  <style>
    :root { color-scheme: dark; --night:#170923; --panel:#24112f; --lime:#baff38; --white:#fff8ee; --muted:#e4d9e9; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--night); color:var(--white); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(760px,100%); padding:clamp(24px,5vw,48px); border:1px solid #694071; border-radius:16px; background:var(--panel); }
    h1,h2 { line-height:1.2; }
    h1 { margin-top:0; }
    h2 { margin-top:32px; color:var(--lime); }
    p { color:var(--muted); }
    a { color:var(--lime); }
  </style>
</head>
<body>
  <main>
    <h1>Terms of Service &amp; Privacy Policy</h1>
    <section id="terms-of-service" aria-labelledby="terms-heading">
      <h2 id="terms-heading">Terms of Service</h2>
      <p>Terms of Service drafted upon purchase to reflect your company.</p>
    </section>
    <section id="privacy-policy" aria-labelledby="privacy-heading">
      <h2 id="privacy-heading">Privacy Policy</h2>
      <p>Privacy Policy drafted upon purchase to reflect your company.</p>
    </section>
    <p><a href="index.html">Back to Halloween App</a></p>
  </main>
</body>
</html>
